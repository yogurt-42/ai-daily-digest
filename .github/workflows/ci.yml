name: ci

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: |
          for f in scripts/*.mjs; do node --check "$f"; done
      - name: Shell check
        run: bash -n scripts/set-github-token.sh
